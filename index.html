<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lone-trail</title>
<meta name="description" content="lone-trail.com — there is nothing here... for now.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04060d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://i.ytimg.com">
<meta property="og:title" content="lone-trail">
<meta property="og:description" content="There is nothing here... For now">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lone-trail.com/">
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="sky__apod" id="apod-layer"></div>
  <canvas class="sky__canvas" id="sky-canvas"></canvas>
</div>

<button class="sky__grab" id="sky-grab" type="button" aria-label="Drag to look around the sky"></button>

<p class="sky__hint" id="sky-hint">
  <span class="sky__hint-en">Drag to look around</span>
  <span class="sky__hint-ko" lang="ko">드래그해서 하늘을 둘러보세요</span>
</p>

<p class="sky__readout" id="sky-readout" aria-hidden="true"></p>

<main>
  <section class="panel panel--hero" id="hero">
    <h1 class="hero__title">There is nothing here&hellip; For now</h1>
    <p class="hero__sub">lone-trail.com</p>

    <a class="scroll-cue" href="#watch">
      <span class="scroll-cue__label">Scroll</span>
      <span class="scroll-cue__arrow" aria-hidden="true"></span>
    </a>
  </section>

  <section class="panel panel--video" id="watch">
    <div class="player" id="player">
      <button class="facade" id="facade" type="button" aria-label="Play the video">
        <img class="facade__thumb" alt=""
             src="https://i.ytimg.com/vi/-s0conum7-Q/maxresdefault.jpg"
             loading="lazy" decoding="async" width="1280" height="720">
        <span class="facade__play" aria-hidden="true"></span>
      </button>
    </div>

    <div class="player__bar">
      <button class="btn" id="sound-btn" type="button" hidden>
        <span lang="ko">소리 켜기</span> <span aria-hidden="true">/ Unmute</span>
      </button>
      <a class="btn btn--ghost" id="yt-link"
         href="https://www.youtube.com/watch?v=-s0conum7-Q"
         target="_blank" rel="noopener noreferrer">YouTube &#8599;</a>
    </div>
  </section>
</main>

<footer class="credits">
  <span id="apod-credit" class="credits__apod"></span>
  <span class="credits__base">&copy; lone-trail</span>
</footer>

<script src="/sky.js" defer></script>
<script src="/video.js" defer></script>
</body>
</html>
